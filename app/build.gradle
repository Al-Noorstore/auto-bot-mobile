plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.alnoor.autobot'
    compileSdk 34

    defaultConfig {
        applicationId "com.alnoor.autobot"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("autobot.p12")
            storePassword "autobot2026"
            keyAlias "autobot"
            keyPassword "autobot2026"
            storeType "PKCS12"
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

chaquopy {
    defaultConfig {
        version "3.11"
        pip {
            install "requests"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
